[OnlineSubsystem]
DefaultPlatformService=Null
; Voice chat through the engine's own voice system (UHCVoiceSubsystem). Was switched off from 0.11.0 to 0.11.4: a voice
; still playing during the seamless travel lobby <-> station kept its playback registered to the old, destroyed world
; (renderer ensure, then a crash in a worker thread, mostly with 3+ players). UHCVoiceSubsystem now releases the voice
; playback of a world before it goes away; tested 2026-11-12 with 4 and 6 players, all talking through both map changes.
; With false the voice subsystem does nothing, the lobby hides the voice chat rule and the voice page of the settings
; menu only offers the microphone (with its level) and the output device.
bHasVoiceEnabled=true
VoiceNotificationDelta=0.2
MaxLocalTalkers=1
MaxRemoteTalkers=16

[Voice]
; The engine's voice module (microphone capture): also used by the microphone level in the settings menu
bEnabled=true

