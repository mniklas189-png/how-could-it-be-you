; How Could It Be You: graphics quality levels (settings -> BILD -> Grafikqualitaet).
;
; Every level keeps everything the game shows: full resolution, flashlight shadows, the light cones in the haze
; (volumetric fog), vignette and film grain (the unease and jumpscare effects use them), the colour fringe of the
; jumpscares, ambient occlusion and screen space reflections. The lower levels only compute the same things in a
; cheaper way (coarser fog grid, cheaper anti-aliasing, smaller shadow and lighting volumes).
; Only the keys that differ from the engine's BaseScalability.ini are listed here.

[ScalabilitySettings]
; The engine lowers the render resolution with the quality level (50 / 71 / 87 / 100 %). This game never renders
; below the full resolution of the window: every level renders at 100 %.
PerfIndexValues_ResolutionQuality="100 100 100 100 100"

;-----------------------------------------------------------------------------------------------------------------

[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=1

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=0

;-----------------------------------------------------------------------------------------------------------------
; Anti-aliasing: TSR at full resolution is the most expensive single pass of a frame. On the low and medium level
; the game uses TAA instead (HCGraphics picks r.AntiAliasingMethod from sg.AntiAliasingQuality: a scalability file
; may not set it).

[AntiAliasingQuality@0]
r.TemporalAA.Quality=1

;-----------------------------------------------------------------------------------------------------------------
; Shadows and haze: the engine switches all shadows (r.ShadowQuality=0) and the volumetric fog off on the low
; levels. Here they stay on; the fog grid is coarser (same as the engine's high level).

[ShadowQuality@0]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.05
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryMissSupersampleCount=4

[ShadowQuality@1]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryMissSupersampleCount=4

;-----------------------------------------------------------------------------------------------------------------

[GlobalIlluminationQuality@0]
; The engine dims sky light on the lowest level; keep the same brightness on every level
r.SkylightIntensityMultiplier=1.0

;-----------------------------------------------------------------------------------------------------------------

[ReflectionQuality@0]
; Screen space reflections stay on (cheapest setting)
r.SSR.Quality=1
r.SSR.HalfResSceneColor=1

;-----------------------------------------------------------------------------------------------------------------
; Post processing: r.Tonemapper.Quality below 2 drops the vignette, below 4 the film grain, and
; r.SceneColorFringeQuality=0 drops the colour fringe of the jumpscares. Ambient occlusion stays on.

[PostProcessQuality@0]
r.AmbientOcclusionLevels=1
r.AmbientOcclusionMaxQuality=50
r.LensFlareQuality=1
r.SceneColorFringeQuality=1
r.Tonemapper.Quality=5

[PostProcessQuality@1]
r.LensFlareQuality=1
r.SceneColorFringeQuality=1
r.Tonemapper.Quality=5

;-----------------------------------------------------------------------------------------------------------------
; Textures stay sharp on every level (the engine's lowest level uses r.Streaming.MipBias=16 and no anisotropic
; filtering); the lower levels only use a smaller streaming pool.

[TextureQuality@0]
r.Streaming.MipBias=0
r.Streaming.AmortizeCPUToGPUCopy=0
r.Streaming.MaxNumTexturesToStreamPerFrame=0
r.Streaming.Boost=1
r.MaxAnisotropy=4
r.Streaming.PoolSize=500

[TextureQuality@1]
r.Streaming.MipBias=0
r.MaxAnisotropy=4

;-----------------------------------------------------------------------------------------------------------------
; Materials look the same on every level; the lower levels use a smaller lighting volume for translucency.

[EffectsQuality@0]
r.RefractionQuality=2
r.DetailMode=1
r.MaterialQualityLevel=1
r.SSS.Scale=0.75

[EffectsQuality@1]
r.RefractionQuality=2
r.MaterialQualityLevel=1
